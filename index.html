<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>음감 훈련 — 교회 반주자를 위한 귀 훈련</title>
    <meta name="description" content="인터벌·코드·진행·솔페지·멜로디·리듬·템포까지 9가지 모드로 매일 5분 음감 훈련. 오프라인 PWA, 약점 집중 학습, 간격 반복(SRS)." />
    <meta name="theme-color" content="#3730a3" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="음감 훈련" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="음감 훈련" />
    <meta property="og:description" content="교회 반주자를 위한 귀 훈련 — 9가지 모드, 약점 집중, 오프라인 PWA" />
    <meta property="og:image" content="./og.png" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet" />
    <!-- Pretendard — used by the G/I/J/M visual themes (selectable in 설정) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>이 앱을 사용하려면 자바스크립트를 활성화해 주세요.</noscript>
    <script>
      // SPA 부팅보다 beforeinstallprompt가 먼저 발생하는 경우가 잦아,
      // 인라인 스크립트에서 가장 먼저 이벤트를 캡처해 전역에 보관한다.
      window.__pwaDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__pwaDeferredPrompt = e;
        window.dispatchEvent(new Event('pwa-install-available'));
      });
      window.addEventListener('appinstalled', () => {
        window.__pwaDeferredPrompt = null;
        window.dispatchEvent(new Event('pwa-installed'));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
